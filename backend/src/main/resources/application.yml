server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: framework
  error:
    include-message: always

spring:
  application:
    name: ciaboc-hrms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hrms}
    username: ${DB_USERNAME:hrms}
    password: ${DB_PASSWORD:Mt2021al}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: Asia/Colombo
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Demo data (repeatable scripts in db/demo) is loaded only with the dev profile; a database that once ran it
    # must still start under other profiles.
    ignore-migration-patterns: "repeatable:missing"
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_SIZE:10MB}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
  jackson:
    time-zone: Asia/Colombo
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # E-mail is optional (messages are queued and simulated when no relay is configured); it must not mark the API down.
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    path: /api/docs

app:
  timezone: Asia/Colombo
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  security:
    jwt:
      # Base64-encoded 256-bit (or longer) secret. MUST be overridden in every non-dev environment.
      secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1jaWFib2MtaHJtcy0yMDI2LWtleQ==}
      issuer: ciaboc-hrms
      access-token-minutes: ${JWT_ACCESS_MINUTES:30}
      refresh-token-hours: ${JWT_REFRESH_HOURS:8}
    lockout:
      max-failed-attempts: 5
      lock-minutes: 15
  files:
    storage-path: ${FILE_STORAGE_PATH:./data/files}
    allowed-extensions: pdf,png,jpg,jpeg,doc,docx,xls,xlsx,csv,txt
    clamav:
      enabled: ${CLAMAV_ENABLED:false}
      host: ${CLAMAV_HOST:clamav}
      port: ${CLAMAV_PORT:3310}
  notifications:
    mail-from: ${MAIL_FROM:hrms-noreply@ciaboc.gov.lk}
    dispatch-interval-ms: 30000
    max-attempts: 5
  bootstrap:
    # Creates the initial administrator on first start-up if no users exist.
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin1234}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@ciaboc.gov.lk}
    reset-existing-admin-password: ${BOOTSTRAP_ADMIN_RESET_EXISTING_PASSWORD:false}
    demo-users: ${BOOTSTRAP_DEMO_USERS:false}
