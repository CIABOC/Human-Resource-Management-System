# CIABOC HRMS — container stack
#   db       PostgreSQL 16 (data on a named volume; never exposed outside the stack)
#   backend  Spring Boot API (internal network only)
#   web      Nginx: HTTPS, SPA, reverse proxy to the API
#   clamav   optional virus scanner for uploads (start with: docker compose --profile av up -d)
#
# Usage:  cp .env.example .env  (set secrets)  &&  sh nginx/generate-dev-cert.sh  &&  docker compose up -d --build

name: ciaboc-hrms

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hrms}
      POSTGRES_USER: ${DB_USERNAME:-hrms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: Asia/Colombo
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: ciaboc-hrms/backend:0.1.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-hrms}
      DB_USERNAME: ${DB_USERNAME:-hrms}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (base64, >= 32 bytes) in .env}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-30}
      JWT_REFRESH_HOURS: ${JWT_REFRESH_HOURS:-8}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-https://localhost}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin1234}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_RESET_EXISTING_PASSWORD: ${BOOTSTRAP_ADMIN_RESET_EXISTING_PASSWORD:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-hrms-noreply@ciaboc.gov.lk}
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
    volumes:
      - file-data:/data/files
    networks: [internal]

  web:
    build: ./frontend
    image: ciaboc-hrms/web:0.1.0
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/hrms.conf:/etc/nginx/conf.d/hrms.conf:ro
      - ./nginx/proxy_params.inc:/etc/nginx/conf.d/proxy_params.inc:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [internal, edge]

  clamav:
    image: clamav/clamav:1.4
    profiles: ["av"]
    restart: unless-stopped
    networks: [internal]

volumes:
  db-data:
  file-data:

networks:
  internal:
    internal: true
  edge:
