# CIABOC HRMS — edge reverse proxy: HTTPS termination, SPA hosting, API proxy, security headers.

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=public:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:20m rate=20r/s;

upstream hrms_api {
    server backend:8081;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;

    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

    # Sign-in endpoints: strict rate limit against password/OTP guessing.
    location ~ ^/api/auth/(login|verify-otp|resend-otp|refresh)$ {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Public certificate verification (no login).
    location /api/public/ {
        limit_req zone=public burst=10 nodelay;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Interactive API docs are not exposed through the edge in production.
    location ~ ^/(api/docs|v3/api-docs|swagger-ui) { return 404; }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Actuator is internal only.
    location /actuator { return 404; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
